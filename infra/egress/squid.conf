# The app's only way out: hosts on the allowlist, HTTPS through CONNECT, every
# request written to the log, nothing cached. Anything else is refused with 403.
acl allowed dstdomain "/etc/squid/allowlist"
acl CONNECT method CONNECT
acl https port 443
http_access deny CONNECT !https
http_access allow allowed
http_access deny all
http_port 3128
cache deny all
logfile_rotate 0
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
