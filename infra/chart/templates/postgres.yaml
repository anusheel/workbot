{{- if .Values.postgres.enabled }}
# One Postgres for the app and for Inngest's own records, each its database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  inngest.sql: create database inngest;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: workbot }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          envFrom:
            - secretRef: { name: postgres }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres, -d, workbot] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.postgres.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
{{- end }}
