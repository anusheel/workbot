# The app's own entrance on the cluster's gateway: the realtime server under
# /realtime and everything else to the web tier, one host for both, so the
# session cookie reaches the realtime server as it is.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: workbot
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      {{- with .Values.host }}
      hostname: {{ . }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workbot
spec:
  parentRefs: [{ name: workbot }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /realtime } }]
      backendRefs: [{ name: realtime, port: {{ .Values.services.realtime.port }} }]
    - backendRefs: [{ name: web, port: {{ .Values.services.web.port }} }]
