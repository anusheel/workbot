{{- $tools := printf "%sworkbot-tools:%s" .Values.registry .Values.tag }}
# Before a new version serves traffic: the schema (additive, so the version
# still running keeps working) and the knowledge base from this version's content.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ $tools }}
          command: [node, --import, tsx, cli/index-knowledge.ts]
          env:
            {{- range $key, $value := .Values.env }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: workbot }
            - secretRef: { name: postgres }
---
# `helm test`: the eval smoke suite against the release, through its database and browser.
apiVersion: v1
kind: Pod
metadata:
  name: smoke
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: {{ $tools }}
      command: [node, --import, tsx, cli/eval.ts, --task, all, --smoke, --runs, "2", --gate]
      env:
        - { name: BROWSER_URL, value: ws://browser:3000/ }
        {{- range $key, $value := .Values.env }}
        - { name: {{ $key }}, value: {{ $value | quote }} }
        {{- end }}
      envFrom:
        - secretRef: { name: workbot }
        - secretRef: { name: postgres }
