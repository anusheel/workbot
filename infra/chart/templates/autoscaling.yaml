# The web tier on the queue's depth, one replica for each so many documents
# waiting to be read, and on CPU for the requests people make: whichever asks
# for more replicas wins.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: web
spec:
  scaleTargetRef: { name: web }
  minReplicaCount: {{ .Values.autoscaling.min }}
  maxReplicaCount: {{ .Values.autoscaling.max }}
  triggers:
    - type: postgresql
      metadata:
        query: select count(*) from inbox where status = 'received'
        targetQueryValue: {{ .Values.autoscaling.documentsPerReplica | quote }}
      authenticationRef: { name: postgres }
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.autoscaling.cpuPercent | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: postgres
spec:
  secretTargetRef:
    - { parameter: connection, name: postgres, key: DATABASE_URL }
