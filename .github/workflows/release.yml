name: Release

# A tag releases its commit: the two images built and pushed under the commit's
# short hash, then infra/release.sh on the cluster, which migrates, waits for
# the new pods, runs the eval smoke suite and rolls back on any failure.
# It runs once a cluster is connected: the repository variable CLUSTER set to
# true, its kubeconfig in the KUBECONFIG secret, and an environment named
# production whose deployments wait for a reviewer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: vars.CLUSTER == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          target: web
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/workbot-web:${{ env.TAG }}
      - uses: docker/build-push-action@v7
        with:
          target: tools
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/workbot-tools:${{ env.TAG }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_FILE" > ~/.kube/config
          infra/release.sh "$TAG" --set registry=ghcr.io/${{ github.repository_owner }}/
        env:
          KUBECONFIG_FILE: ${{ secrets.KUBECONFIG }}
